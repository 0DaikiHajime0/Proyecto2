[project]
name = "mle-project2-spotify-popularity"
version = "1.0.0"
description = "Spotify Track Popularity Prediction - ML Engineering Final Project (Curso II)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.8.0",
    "dagshub>=0.3.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*"]
