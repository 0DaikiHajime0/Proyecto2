[project]
name = "mle-project2-churn-analysis"
version = "0.1.0"
description = "Customer Churn Prediction - ML Engineering Final Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "mlflow>=2.8.0",
    "dagshub>=0.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.1",
    "faiss-cpu>=1.7.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "Sphinx>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*"]
